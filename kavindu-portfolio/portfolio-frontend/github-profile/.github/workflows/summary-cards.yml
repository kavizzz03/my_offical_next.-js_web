name: Generate profile summary cards

on:
  schedule:
    - cron: "0 1 * * *"   # every day at 01:00 UTC
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Uses your own token if you add a secret named SUMMARY_GITHUB_TOKEN,
          # otherwise falls back to the built-in token.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"   # change to "master" if that is your default branch
          UTC_OFFSET: 5         # Sri Lanka is UTC+5:30
